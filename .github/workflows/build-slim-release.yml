name: Build slim release

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: slim-release
  cancel-in-progress: true

jobs:
  release:
    if: github.repository == 'sambarlick/tuya-local'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build slim zip
        run: |
          set -euo pipefail
          src=custom_components/tuya_local
          out=$(mktemp -d)
          # Copy everything except the device configs
          cp -a "$src/." "$out/"
          # Drop only the device YAMLs; keep __init__.py, schema, README etc.
          rm -f "$out"/devices/*.yaml
          # Copy back device configs matching the allowlist
          shopt -s nullglob
          while IFS= read -r pat; do
            pat="${pat%%#*}"; pat="$(echo "$pat" | xargs)"
            [ -z "$pat" ] && continue
            for f in $src/devices/$pat; do cp "$f" "$out/devices/"; done
          done < slim-devices.txt
          count=$(ls "$out/devices"/*.yaml | wc -l)
          echo "Kept $count device configs"
          [ "$count" -gt 0 ] || { echo "Allowlist matched nothing"; exit 1; }
          (cd "$out" && zip -qr "$GITHUB_WORKSPACE/tuya_local.zip" .)
          ls -lh tuya_local.zip
          # Release notes: list of included device configs
          {
            echo "Slim build of \`$(git rev-parse --short HEAD)\` — $count device configs."
            echo
            echo "| Config | Name |"
            echo "|---|---|"
            for f in "$out"/devices/*.yaml; do
              n=$(grep -m1 '^name:' "$f" | sed 's/^name:[[:space:]]*//')
              echo "| \`$(basename "$f" .yaml)\` | $n |"
            done
          } > "$GITHUB_WORKSPACE/release-notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sortable CalVer: YYYY.M.D.<run number>, e.g. 2026.10.23.42
          tag="$(date -u +%Y.%-m.%-d).${{ github.run_number }}"
          gh release create "$tag" tuya_local.zip \
            --title "$tag" \
            --notes-file release-notes.md \
            --latest

      - name: Prune old releases (keep newest 5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r t; do
            gh release delete "$t" --yes --cleanup-tag
          done
