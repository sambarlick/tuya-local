name: Fan with oscillation angle
# Sam's Kogan fan (fw 2.6.22, modelId fzoy2w). Add its product_id here
# from Tuya Local diagnostics once added, so detection is exact.
# products:
#   - id: <product_id>
#     manufacturer: Kogan
#     model: <model>
entities:
  - entity: fan
    translation_only_key: fan_with_presets
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: close
            value: normal
          - dps_val: sleep
            value: sleep
          - dps_val: fresh
            value: fresh
          - dps_val: heavy
            value: strong
      - id: 3
        type: integer
        name: speed
        range:
          min: 1
          max: 9
      - id: 102
        type: string
        name: oscillate
        mapping:
          - dps_val: close
            value: false
          - dps_val: "90"
            value: true
          - dps_val: "60"
            value: true
          - dps_val: "30"
            value: true
  - entity: select
    name: Oscillation angle
    icon: "mdi:arrow-oscillating"
    category: config
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: close
            value: "Off"
          - dps_val: "30"
            value: "30°"
          - dps_val: "60"
            value: "60°"
          - dps_val: "90"
            value: "90°"
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 13
        type: boolean
        name: switch
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 22
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 23
        type: integer
        name: sensor
        unit: min
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 24
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
