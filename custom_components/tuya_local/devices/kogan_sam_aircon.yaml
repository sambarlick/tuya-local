# Sam's Kogan portable aircon (Bedroom Aircon).
# Based on upstream kogan_kawfpac16pya_airconditioner.yaml
# (base: upstream 05e0afa), rebuilt from the Tuya data model
# (modelId 000002iuqn).
# Changes from upstream:
#   - HEAT mode fixed (device sends "HEAT", upstream mapped "Heat")
#   - Sleep preset: none/sleep (was sleep/comfort)
#   - Timer (103) is a settable number; countdown (105) a sensor
#   - 102 defrost, 106 alarms (incl. tank full), 109 internal drying,
#     110 unit type mapped (were unknown_*)
name: Portable aircon (Sam)
products:
  - id: 1z9vbwsgpmsrhuha
    manufacturer: Kogan
    model: Smart PAC_PY16
entities:
  - entity: climate
    translation_only_key: aircon_extra
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: COOL
                value: cool
              - dps_val: FAN
                value: fan_only
              - dps_val: DRY
                value: dry
              - dps_val: HEAT
                value: heat
      - id: 2
        name: temperature
        type: integer
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: C
                range:
                  min: 16
                  max: 32
              - dps_val: F
                range:
                  min: 61
                  max: 86
      - id: 3
        name: current_temperature
        type: integer
      - id: 4
        name: mode
        type: string
        hidden: true
      - id: 5
        name: fan_mode
        type: string
        mapping:
          - dps_val: "1"
            value: low
          - dps_val: "2"
            value: medium
          - dps_val: "3"
            value: high
      - id: 19
        name: temperature_unit
        type: string
        mapping:
          - dps_val: C
            value: C
          - dps_val: F
            value: F
      - id: 101
        name: preset_mode
        type: boolean
        mapping:
          - dps_val: false
            value: none
          - dps_val: true
            value: sleep
      - id: 104
        name: swing_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: "on"
      - id: 110
        name: unit_type
        type: string
        mapping:
          - dps_val: "0"
            value: heat_cool
          - dps_val: "1"
            value: cool_only
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: C
            value: celsius
          - dps_val: F
            value: fahrenheit
  - entity: sensor
    class: temperature
    dps:
      - id: 3
        type: integer
        name: sensor
        class: measurement
      - id: 19
        type: string
        name: unit
        mapping:
          - dps_val: C
            value: C
          - dps_val: F
            value: F
  - entity: number
    translation_key: timer
    class: duration
    category: config
    dps:
      - id: 103
        type: integer
        name: value
        unit: h
        range:
          min: 0
          max: 24
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: min
  - entity: switch
    translation_key: auto_dry
    category: config
    icon: "mdi:air-filter"
    dps:
      - id: 109
        type: boolean
        name: switch
  - entity: binary_sensor
    translation_key: defrost
    category: diagnostic
    dps:
      - id: 102
        type: boolean
        name: sensor
  - entity: binary_sensor
    translation_key: tank_full
    dps:
      # Alarm bitmap (106) bit 0 = water tank full: true for any odd value
      - id: 106
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 1
            value: true
          - dps_val: 3
            value: true
          - dps_val: 5
            value: true
          - dps_val: 7
            value: true
          - dps_val: 9
            value: true
          - dps_val: 11
            value: true
          - dps_val: 13
            value: true
          - dps_val: 15
            value: true
          - dps_val: 17
            value: true
          - dps_val: 19
            value: true
          - dps_val: 21
            value: true
          - dps_val: 23
            value: true
          - dps_val: 25
            value: true
          - dps_val: 27
            value: true
          - dps_val: 29
            value: true
          - dps_val: 31
            value: true
          - value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      # Any other alarm: bits 1-4 = Tp sensor fault, Tr sensor fault,
      # pressure protection, anti-freeze (cooling)
      - id: 106
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 1
            value: false
          - value: true
