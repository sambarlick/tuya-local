# Sam's lux sensor (fw 3.1.3 / MCU 1.1.0, modelId 0000004tsh).
# Copy of upstream illumanance_sensor.yaml (base: upstream 05e0afa).
# Changes from upstream: name only. Add product ID from the
# "Adding ... product id" log line once known.
name: Lux sensor (Sam)
# products:
#   - id: <product_id>
#     manufacturer: Tuya
#     model: Light sensor
entities:
  - entity: sensor
    name: Brightness
    class: illuminance
    dps:
      - id: 2
        type: integer
        name: sensor
        unit: lx
        class: measurement
  - entity: sensor
    name: Light level
    class: enum
    category: diagnostic
    dps:
      - id: 1
        type: string
        name: sensor
        mapping:
          - dps_val: low
            value: Low
          - dps_val: middle
            value: Medium
          - dps_val: high
            value: High
