# Sam's lux sensor (fw 3.1.3 / MCU 1.1.0, modelId 0000004tsh).
# Copy of upstream illumanance_sensor.yaml (base: upstream 05e0afa).
# Changes from upstream: name and product ID only.
name: Lux sensor (Sam)
products:
  - id: oedbumjmptbajtqz
    manufacturer: Tuya
    model: LightSensor
entities:
  - entity: sensor
    name: Brightness
    class: illuminance
    dps:
      - id: 2
        type: integer
        name: sensor
        unit: lx
        class: measurement
  - entity: sensor
    name: Light level
    class: enum
    category: diagnostic
    dps:
      - id: 1
        type: string
        name: sensor
        mapping:
          - dps_val: low
            value: Low
          - dps_val: middle
            value: Medium
          - dps_val: high
            value: High
