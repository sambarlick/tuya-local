# Sam's Mirabella Genio powerboard (5 switches incl. USB).
# Copy of upstream mirabella_power_strip.yaml (base: upstream 05e0afa).
# Changes from upstream:
#   - products: only Sam's board
#   - Light mode select removed (DP 40 not present on this board)
name: Genio powerboard (Sam)
products:
  - id: 5dvqb3eeuhhnjnlr
    manufacturer: Mirabella Genio
    model: Smart Power Board 2Gnd
entities:
  - entity: switch
    translation_key: outlet_x
    translation_placeholders:
      x: "1"
    class: outlet
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 42
        type: string
        optional: true
        name: cycle_schedule
      - id: 43
        type: string
        optional: true
        name: random_schedule
      - id: 44
        type: string
        optional: true
        name: inching
  - entity: switch
    translation_key: outlet_x
    translation_placeholders:
      x: "2"
    class: outlet
    dps:
      - id: 2
        type: boolean
        name: switch
  - entity: switch
    translation_key: outlet_x
    translation_placeholders:
      x: "3"
    class: outlet
    dps:
      - id: 3
        type: boolean
        name: switch
  - entity: switch
    translation_key: outlet_x
    translation_placeholders:
      x: "4"
    class: outlet
    dps:
      - id: 4
        type: boolean
        name: switch
  - entity: switch
    translation_key: outlet_x
    translation_placeholders:
      x: "5"
    class: outlet
    dps:
      - id: 5
        type: boolean
        name: switch
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "1"
    dps:
      - id: 9
        name: second
        type: integer
        range:
          min: 0
          max: 86400
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "2"
    dps:
      - id: 10
        name: second
        type: integer
        range:
          min: 0
          max: 86400
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "3"
    dps:
      - id: 11
        name: second
        type: integer
        range:
          min: 0
          max: 86400
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "4"
    dps:
      - id: 12
        name: second
        type: integer
        range:
          min: 0
          max: 86400
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "5"
    dps:
      - id: 13
        name: second
        type: integer
        range:
          min: 0
          max: 86400
  - entity: select
    category: config
    translation_key: initial_state
    dps:
      - id: 38
        name: option
        type: string
        mapping:
          - dps_val: memory
            value: memory
          - dps_val: "on"
            value: "on"
          - dps_val: "off"
            value: "off"
  - entity: lock
    category: config
    translation_key: child_lock
    dps:
      - id: 41
        name: lock
        type: boolean
